<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="v4.css"><link rel="stylesheet" href="reel.css">
<style>
.stage{background:radial-gradient(70% 40% at 50% 52%,rgba(63,149,246,.32),transparent 70%),#060B17}
.stage>.logo{top:96px;right:90px;bottom:auto}
.floor{height:42%;bottom:-4%}
.t{position:absolute;right:90px;left:90px;opacity:0;transform:translateY(40px);transition:all .7s cubic-bezier(.2,.8,.2,1)}
.t.on{opacity:1;transform:none}
.t.off{opacity:0;transform:translateY(-30px)}
.h{font-size:128px}
#lapw{position:absolute;left:110px;top:900px;width:860px;opacity:0;transform:translateY(160px) perspective(2200px) rotateX(18deg);transition:all 1.1s cubic-bezier(.2,.8,.2,1)}
#lapw.on{opacity:1;transform:translateY(0) perspective(2200px) rotateX(4deg)}
#lapw.down{transform:translateY(120px) perspective(2200px) rotateX(4deg) scale(.86)}
.lap{position:relative}
.scr img{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.scr img.on{opacity:1}
.pills .pill{opacity:0;transform:scale(.8);transition:all .5s cubic-bezier(.2,.8,.2,1);font-size:38px;padding:20px 32px}
.pills .pill.on{opacity:1;transform:none}
.progress{background:#3F95F6;box-shadow:0 0 18px #3F95F6}
</style></head><body>
<div class="stage grain on-dark">
  <div class="horizon" style="top:1180px"></div><div class="floor"></div>
  {{LOGO_D}}
  <div class="t" id="t1" style="top:560px"><h1 class="h">לעסק שלכם<br><em>אין אתר?</em></h1></div>
  <div class="t" id="t2" style="top:380px"><div class="eyebrow">מתיק העבודות · קונספט</div><h1 class="h" style="font-size:104px;margin-top:30px">ככה זה יכול<br><em>להיראות.</em></h1></div>
  <div class="t" id="t3" style="top:380px"><h1 class="h" style="font-size:104px">כל מה שאתר<br>צריך <em>כדי למכור.</em></h1>
    <div class="pills" style="margin-top:50px"><span class="pill" id="p1">עיצוב אישי</span><span class="pill" id="p2">מושלם בטלפון</span><span class="pill" id="p3">וואטסאפ בכל מסך</span><span class="pill" id="p4">נגיש</span></div></div>
  <div class="t" id="t4" style="top:420px"><div class="eyebrow">בלי התחייבות</div><h1 class="h" style="font-size:116px;margin-top:30px">סקיצה ראשונה<br><em>בחינם.</em></h1>
    <p class="p" style="margin-top:36px;font-size:46px">רואים את האתר שלכם, ורק אז מחליטים.</p>
    <div style="margin-top:56px"><div class="btn" style="font-size:52px;padding:36px 54px">{{WA}}<span>לסקיצה חינם בוואטסאפ</span></div></div>
    <div class="tel" style="margin-top:40px;font-size:60px">058-7336636</div></div>
  <div id="lapw"><div class="lap"><div class="lid"><span class="cam"></span><div class="scr"><img id="s1" class="on" src="shots/livna.png"><img id="s2" src="shots/kora.png"><img id="s3" src="shots/sharon.png"></div></div><div class="base"></div></div></div>
  <div class="progress" id="pg"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const at=(t,f)=>setTimeout(f,t);
const total=21000;
window.start=function(){
  const pg=$('pg');pg.style.transition=`width ${total}ms linear`;requestAnimationFrame(()=>pg.style.width='100%');
  at(50,()=>$('t1').classList.add('on'));
  at(2600,()=>{$('t1').classList.add('off');$('t1').classList.remove('on')});
  at(2900,()=>{$('t2').classList.add('on');$('lapw').classList.add('on')});
  at(5300,()=>{$('s2').classList.add('on')});
  at(7500,()=>{$('s3').classList.add('on')});
  at(9600,()=>{$('t2').classList.remove('on');$('t2').classList.add('off')});
  at(9900,()=>{$('t3').classList.add('on');$('lapw').classList.add('down')});
  ['p1','p2','p3','p4'].forEach((p,i)=>at(10500+i*450,()=>$(p).classList.add('on')));
  at(14200,()=>{$('t3').classList.remove('on');$('t3').classList.add('off');$('lapw').style.opacity='0'});
  at(14600,()=>$('t4').classList.add('on'));
};
if(!location.search.includes('rec'))start();
</script></body></html>
