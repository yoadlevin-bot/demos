<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="tech.css">
<style>
.cover{width:1640px;height:624px;background:radial-gradient(90% 140% at 90% 0%,#1B2C55 0%,var(--ink) 60%);color:#fff}
.cover .t{position:absolute;right:120px;top:50%;transform:translateY(-50%)}
.cover h1{font:900 92px/1.05 Heebo;letter-spacing:-.025em}
.cover h1 em{font-style:normal;color:var(--acc)}
.cover p{font:400 34px/1.4 Heebo;opacity:.85;margin-top:22px}
.cover .lockup{position:absolute;left:170px;top:50%;transform:translateY(-50%)}
.pf{width:1080px;height:1080px;background:var(--ink);display:grid;place-items:center}

.hl{width:1080px;height:1920px;background:var(--ink);display:grid;place-items:center}
.hl .c{width:620px;height:620px;border-radius:50%;background:var(--acc-d);display:grid;place-items:center}
.hl svg{width:300px;height:300px}
</style></head><body>

  <div class="t">

    <p>אתרים לעסקים קטנים · סקיצה ראשונה בחינם</p>
  </div>
</section>
